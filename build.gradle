plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex("net\\.runelite.*") }
    }
    mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeliteVersion').orElse('latest.release').get()
def pluginMainClass = 'com.feralenterprises.hoverlite.HoverLiteDevLauncher'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.feralenterprises'
version = '0.5'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Run an isolated RuneLite development client with HoverLite loaded.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

/**
 * Prebuilt stand-alone RuneLite developer launcher for owner QA.
 * Includes HoverLite, its test launcher and runtime dependencies.
 * This is not a Plugin Hub distribution JAR.
 */
tasks.register('portableClientJar', Jar) {
    dependsOn tasks.named('testClasses')
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': 'true')
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from {
        configurations.testRuntimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'
    archiveFileName.set('hoverlite-runelite-dev-all.jar')
    group = 'distribution'
    description = 'Build a portable RuneLite developer JAR with HoverLite bundled.'
}
