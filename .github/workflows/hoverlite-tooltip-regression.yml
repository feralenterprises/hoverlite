name: HoverLite tooltip regression

on:
  pull_request:
  push:
    branches:
      - feature/hoverlite-selective-tooltip-shortening-20261115

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Compile and run tooltip safety tests
        run: gradle --no-daemon clean test
